name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: web (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
      - name: API client types are up to date
        run: |
          npm run gen:api
          git diff --exit-code -- src/lib/api/schema.d.ts

  api:
    name: api (FastAPI)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock
      - run: uv python install 3.12
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run python -m pytest
      - run: uv run alembic heads
      - name: openapi.json is up to date
        run: uv run python scripts/export_openapi.py --check

  image:
    name: api image (Docker)
    runs-on: ubuntu-latest
    needs: api
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the production image
        uses: docker/build-push-action@v6
        with:
          context: apps/api
          load: true
          tags: compliance-os-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Boot the image against PostgreSQL (migrations, seed, health)
        run: |
          docker run -d --name api --network host -e DATABASE_URL=postgresql://postgres:postgres@127.0.0.1:5432/postgres -e APP_ENV=development -e PORT=8000 compliance-os-api:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/api/v1/health >/dev/null; then echo "healthy after ${i}s"; break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8000/api/v1/health
          docker logs api | grep -E "applying migrations|seeding versioned content|starting api"
          test "$(docker inspect -f '{{.State.Running}}' api)" = "true"
      - name: Run the reminders job through the same image
        run: |
          docker run --rm --network host -e DATABASE_URL=postgresql://postgres:postgres@127.0.0.1:5432/postgres -e APP_ENV=development compliance-os-api:ci python scripts/send_reminders.py
      - name: Refuse to start with an incomplete production configuration
        run: |
          set +e
          docker run --rm --network host -e DATABASE_URL=postgresql://postgres:postgres@127.0.0.1:5432/postgres -e APP_ENV=production compliance-os-api:ci >out.txt 2>&1
          status=$?
          set -e
          test "$status" -ne 0
          grep -q "JWT_SECRET" out.txt
      - if: always()
        run: docker rm -f api || true
